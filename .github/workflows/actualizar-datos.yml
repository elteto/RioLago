name: Actualizar datos RioLago

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos-riolago
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Consultar WebService y generar JSON
        run: python actualizar.py

      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Actualizar niveles río y lago"
            git push
          fi
